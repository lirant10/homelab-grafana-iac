global:
  scrape_interval: 60s
  external_labels:
    cluster: lab
    replica: r1

scrape_configs:
  - job_name: 'vmware_esx'
    metrics_path: /metrics
    # Scrape vCenter, not each ESXi host: vCenter reports every host it manages
    # (two hosts today, one of them 192.168.0.49), their VMs and datastores.
    # Scraping a host directly as well would count its VMs twice on the dashboard.
    # "section" picks the vcenter: block in ~/.config/vmware-exporter/config.yml.
    params:
      section: [vcenter]
    static_configs:
      - targets:
        - '192.168.0.50'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'host.containers.internal:9272'

  - job_name: 'podman'
    static_configs:
      - targets: ['host.containers.internal:9882']
        labels:
          instance: arch-pc
      - targets: ['192.168.0.63:9882']
        labels:
          instance: azure-docker
      - targets: ['192.168.0.89:9882']
        labels:
          instance: vaultwarden
