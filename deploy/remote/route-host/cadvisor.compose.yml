# cAdvisor - Prometheus metrics for the Docker containers on route-host
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    ports: ["8088:8080"]
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=false"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
